; 평가 데이터 전부로 통일 — 감시 프로그램 (supervisord). /etc/supervisor/conf.d/full799.conf 로 복사한다.
; 단계 스크립트는 setsid로 따로 띄우므로 감시가 다시 시작돼도 측정은 끊기지 않는다.
[program:full799f]
command=/bin/bash /workspace/vlm_project_2/scripts/full799_supervisor6.sh
directory=/workspace/vlm_project_2
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
stdout_logfile=/workspace/vlm_project_2/logs/full799_supervisor6.log
redirect_stderr=true

; NVIDIA MPS 서버 — 측정 감시(full799f)보다 먼저 뜬다 (2026-10-21)
[program:mps]
command=/bin/bash -c "mkdir -p /tmp/nvidia-mps /tmp/nvidia-mps-log; export CUDA_MPS_PIPE_DIRECTORY=/tmp/nvidia-mps CUDA_MPS_LOG_DIRECTORY=/tmp/nvidia-mps-log; exec nvidia-cuda-mps-control -f"
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/workspace/vlm_project_2/logs/mps.log
redirect_stderr=true

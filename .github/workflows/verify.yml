# 검사 전부를 CI에서 돌린다 (2026-10-02 신설).
#
# **가벼운 환경에서 돈다.** 문서·메타 검사 여섯(수치 감사·출처 대조·문서↔코드 계약·원장
# 정합성·합본 집계와 회귀 둘)은 **pyyaml만** 있으면 되고, torch가 필요한 도구 스모크는
# `verify_all.py`가 **건너뛴다 — 실패가 아니다.** 건너뛴 것은 로그에 ⊘로 찍힌다.
#
# `verify_all.py`가 기대 종료코드를 표에 적고 대조하므로, **회귀 시험 둘이 종료코드 1이어야
# 정상**이라는 반전을 CI 설정에 다시 적지 않는다. 한 군데만 고치면 된다.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"      # INSTALL.md 기준

      - name: pyyaml (문서·메타 검사에 필요한 유일한 외부 패키지)
        run: python -m pip install --quiet pyyaml

      - name: 검사 전부
        run: python scripts/verify_all.py

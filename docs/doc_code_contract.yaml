# 문서의 논거 ↔ 코드 구현 (원장 L9). 2026-10-02 신설.
#
# **왜 필요한가.** 문서에서 판단이 바뀌어도 코드가 따라오지 않는 일이 2026-09-17에 두 번
# 나왔다. 값 검사(audit_numbers)도 출처 검사(verify_claim_provenance)도 이 부류를 통과시킨다
# — 문서 안에서는 일관되기 때문이다. 어긋난 것은 문서와 산출물 사이다.
#
# **무엇을 닫는가.** 여기 등록된 쌍에 대해서는 **되돌림이 자동으로 잡힌다.** 등록되지 않은
# 범위는 여전히 사람 몫이다(그래서 L9는 「절반 닫힘」이고 완전 닫힘이 아니다).
#
# **등록 기준.** 문서가 특정 코드 동작을 근거로 삼는 자리. 특히 7장 도구는 4~6장의 결론을
# 실행하는 물건이므로, 4~6장의 판단이 바뀌면 그 판단을 구현한 함수를 여기 건다.
#
# code 검사 셋:
#   function + must_use  — 그 함수가 이 식별자/문자열 키를 쓴다 (docstring·주석은 제외한다.
#                          설명이 아니라 동작을 본다)
#   function + must_not_use — 쓰지 않는다
#   constant + value     — 모듈 상수가 이 값이다

pairs:
  - id: gate-statistic
    claim: "게이트 판정은 최악 여유로 한다 — p50으로 걸면 λ=0.0(p50 1.14·최악 0.87, 11% 붕괴)을 놓친다"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["최악 여유"]
    code:
      file: scripts/headroom_guard.py
      function: plan_fix
      must_use: ["headroom_worst"]
    broke_once: "2026-09-17 — 문서는 §7.4에서 최악으로 결론냈는데 plan_fix()가 계속 p50으로 걸고 있었다"

  - id: dla-available-formats
    claim: "bf16 권고는 대상이 그 형식을 지원할 때만 유효하다 — Jetson DLA는 FP16·INT8만 지원한다"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["DLA"]
    code:
      file: scripts/headroom_guard.py
      function: main
      must_use: ["available_formats"]
    broke_once: "2026-09-17 — 문서는 DLA에 bf16이 없다고 적었는데 도구가 대상을 묻지 않고 모두에게 bf16을 권했다"

  - id: marginal-headroom
    claim: "보조 경고 임계값은 1.25다 — 측정이 아니라 설계 판단이며 그 사실을 함께 출력한다"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["1.25"]
    code:
      file: scripts/headroom_guard.py
      constant: MARGINAL_HEADROOM
      value: 1.25
    broke_once: "깨진 적은 없다. 원장 O4가 '측정 아님'을 세 곳으로 확대한 뒤 상수가 흩어지지 않게 건다"

  # ── 7.2절 설계 판단 ①④⑥⑦⑨와 7.3절 표본 상한 (2026-10-02 추가) ──────────────
  # 고른 기준: 되돌아가면 **조용히 틀린 값이 나오거나 논문이 반례가 되는** 자리.
  # ④는 L16이, ⑨는 C5가 실제로 그 부류였다.

  - id: two-dtype-split
    claim: "크기는 넘치지 않는 형식(bf16)에서 재고 붕괴는 목표 형식에서 잰다 (7.2① · 설계 원칙 2)"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["크기는 bf16에서"]
    code:
      file: scripts/headroom_guard.py
      function: main
      must_use: ["MAG"]
    broke_once: "깨진 적은 없다. 목표 형식에서 크기를 재면 이미 발산한 이미지의 최댓값이 inf가 되어 **조용히 틀린다**"

  - id: tower-out-included
    claim: "비전 인코더의 블록 뒤 출력도 재고 나쁜 쪽으로 판정한다 (7.2④)"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["블록 뒤 출력"]
    code:
      file: scripts/headroom_guard.py
      function: profile
      must_use: ["tower_out"]
    broke_once: "원장 L16 — 계열 조사가 `blocks[-1]`만 재서 블록 뒤 연산을 놓쳤다. 안전을 과대평가할 수 있었다"

  - id: scaled-formats-out-of-scope
    claim: "스케일 형식(INT8·INT4·fp8)은 선언만 받고 '내 소관이 아니다'라고 답한다 (7.2⑥)"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["스케일 형식"]
    code:
      file: scripts/headroom_guard.py
      function: main
      must_use: ["scaled_formats_declared"]
    broke_once: "깨진 적은 없다. 스케일 형식에 절대 크기 기준을 적용하면 틀린 판정을 내므로 범위를 코드에 박아 둔다"

  - id: residual-split-solve
    claim: "블록 출력은 `잔차 + MLP(...)`이므로 잔차를 분리해 축소량을 푼다 (7.2⑦)"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["잔차를 분리"]
    code:
      file: scripts/headroom_guard.py
      function: plan_fix
      must_use: ["solve_factor"]
    broke_once: "깨진 적은 없다. 근사값으로 되돌리면 교정량이 과소·과대가 되고 교정본의 0% 붕괴가 흔들린다"

  - id: silent-load-guard
    claim: "조용히 틀리는 적재를 막는다 — 가중치가 실제로 올라왔는지 확인한다 (7.2⑨)"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["조용히 틀리는 적재"]
    code:
      file: scripts/headroom_guard.py
      function: load_tower_repo
      must_use: ["check_weights_loaded"]
    broke_once: "원장 C5 — `from_pretrained`가 조용히 랜덤 초기화해도 측정은 돌아가고 숫자가 나온다"

  - id: zero-observation-bound
    claim: "초과 0건이면 표본 수에 따른 참 초과율의 95% 상한을 함께 적는다 (7.3절)"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["95% 상한"]
    code:
      file: scripts/headroom_guard.py
      function: print_verdict
      must_use: ["zero_obs_upper_bound"]
    broke_once: "깨진 적은 없다. 상한 없이 '안전'만 찍으면 표본 30장과 250장이 같은 말로 읽힌다"

  # ── 7.2절 ②③⑧ (2026-10-02 추가). 앞서 "식별자로 고정하기 어렵다"며 뺐던 셋이다.
  # 검사 유형을 늘려 걸었다 — ②는 기본값 자체가 논거이고, ③은 하드코딩 회귀가 실제로
  # 있었고, ⑧은 도구가 **내는 말**을 보면 된다.

  - id: model-default-max-pixels
    claim: "모델 기본 설정을 기본값으로 쓴다 — `--max_pixels`를 주지 않으면 모델 자신의 설정을 따른다 (7.2②)"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["모델 기본 설정을 기본값으로"]
    code:
      file: scripts/headroom_guard.py
      argparse:
        - option: "--max_pixels"
          default: null
    broke_once: "깨진 적은 없다. 여기에 값이 박히면 **문서가 거짓이 되는데 식별자 검사로는 보이지 않는다** — 그래서 기본값을 직접 본다"

  - id: family-name-pattern
    claim: "계열 차이는 이름 패턴으로 흡수한다 — 블록 리스트 이름이 계열마다 다르다 (7.2③)"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["이름 패턴으로 흡수"]
    code:
      file: scripts/headroom_guard.py
      function: get_blocks
      must_use: ["find_blocks"]
    broke_once: "2026-09-15 — `tower.blocks`를 하드코딩해 SmolVLM(Idefics3, `encoder.layers`)에서 죽었다. 하드코딩으로 되돌아가면 이 검사가 잡는다"

  - id: fix-cost-reported
    claim: "교정은 권하지 않고 비용과 함께 보고한다 — 완전 등가가 아니며 정확도 비용은 따로 재야 한다 (7.2⑧)"
    docs: [thesis_ch7_ch8_draft.md]
    docs_must_contain: ["교정은 권하지 않고"]
    code:
      file: scripts/headroom_guard.py
      function: main
      must_say: ["완전 등가가 아니다", "정확도 비용"]
    broke_once: "깨진 적은 없다. 비용 경고가 사라지면 도구가 교정을 **권하는 물건**이 되어 7.2⑧의 설계 판단과 어긋난다"

  # ══ 원장 「닫힘」 C1~C8의 장치가 코드에 있는지 (2026-10-02) ════════════════════
  # **왜 이것이 가장 중요한가.** 닫힘 항목의 장치가 리팩터링 중 조용히 사라지면, 원장은
  # 계속 "막고 있다"고 말하는데 실제로는 안 막는다. **정확히 L9 부류이고, 피해는 더 크다**
  # — 닫힌 줄 알고 더 보지 않기 때문이다. 아래 쌍은 원장의 주장과 코드를 양방향으로 묶는다.

  - id: c1-values-compared
    claim: "C1 — 문서 숫자가 산출물과 다른 것을 `values:` 대조로 막는다"
    docs: [docs/weakness_ledger.md]
    docs_must_contain: ["문서 숫자가 산출물과 다름"]
    code:
      file: scripts/verify_claim_provenance.py
      function: check_group
      must_use: ["values"]
    broke_once: "깨진 적은 없다. 사라지면 원장 C1이 거짓이 된다"

  - id: c2-condition-mixing
    claim: "C2 — 한 표의 숫자가 다른 조건에서 온 것을 `sources:`/`allow_differ:`로 막고 이유를 쓰게 한다"
    docs: [docs/weakness_ledger.md]
    docs_must_contain: ["이유를 쓰게 강제"]
    code:
      file: scripts/verify_claim_provenance.py
      function: check_group
      must_use: ["sources", "allow_differ"]
    broke_once: "원장의 실증 신호 — 핵심을 때린 약점 3건이 모두 이 채널(Table 1의 조건 혼입)이었다"

  - id: c3-stale-across-docs
    claim: "C3 — 같은 수치를 한 곳만 고치는 것을 `docs:`/`stale:`로 막는다"
    docs: [docs/weakness_ledger.md]
    docs_must_contain: ["한 곳만 고침"]
    code:
      file: scripts/verify_claim_provenance.py
      function: scan_docs
      must_use: ["stale"]
    broke_once: "2026-09-15 — Table 1을 고치며 개요 다섯 곳을 놓쳤다. JSON만 보는 검사로는 원리적으로 안 잡힌다"

  - id: c4-nonfinite-raises
    claim: "C4 — bf16 활성이 비유한인데 측정값으로 기록되는 것을 예외로 막는다"
    docs: [docs/weakness_ledger.md]
    docs_must_contain: ["측정값으로 기록"]
    code:
      file: scripts/profile_other_vlm_families.py
      function: profile
      must_use: ["isfinite"]
    broke_once: "깨진 적은 없다. bf16 상한은 3.4e38이라 비유한 값은 측정 실패이지 큰 활성이 아니다"

  - id: c5-strict-load
    claim: "C5 — `from_pretrained`의 조용한 랜덤 초기화를 strict 적재로 막는다"
    docs: [docs/weakness_ledger.md]
    docs_must_contain: ["랜덤 초기화"]
    code:
      file: scripts/probe_vision_tower_direct.py
      function: profile
      must_use: ["load_state_dict", "missing"]
    broke_once: "조용히 랜덤 초기화돼도 측정은 돌아가고 숫자가 나온다 — 값만 보면 알 수 없다"

  - id: c6-failure-preserved
    claim: "C6 — 디스크 스킵 기록이 기존 실패 사유를 덮어쓰지 않게 보존한다"
    docs: [docs/weakness_ledger.md]
    docs_must_contain: ["실패 사유를 덮어씀"]
    code:
      file: scripts/profile_other_vlm_families.py
      function: main
      must_use: ["failed"]
    broke_once: "덮어쓰면 '디스크 때문에 못 쟀다'와 '재다가 실패했다'가 구별되지 않는다"

  - id: c7-retired-values
    claim: "C7 — 정정한 값이 다른 자리에 남은 것을 `retired:`로 잡고, 정정 박스와 본문을 구분한다"
    docs: [docs/weakness_ledger.md]
    docs_must_contain: ["정정한 값이 다른 자리에 남음"]
    code:
      file: scripts/audit_numbers.py
      function: main
      must_use: ["retired"]
    broke_once: "값 대조도 출처 대조도 통과한다 — 캡션·주석·다른 장에 남은 옛 값은 그 자리에서 일관되기 때문이다"

  - id: c8-condition-watch
    claim: "C8 — 조건 종속 값이 조건 없이 쓰인 것을 `watch:`로 경고한다"
    docs: [docs/weakness_ledger.md]
    docs_must_contain: ["조건 없이"]
    code:
      file: scripts/audit_numbers.py
      function: main
      must_use: ["watch"]
    broke_once: "값은 맞고 조건만 빠지므로 값 대조로는 영원히 통과한다"

  - id: record-section-split
    claim: "C7의 전제 — 기록 구역과 본문을 구분한다. 구분이 없으면 작업 기록의 옛 값이 전부 오류로 올라와 검사가 무력해진다"
    docs: [docs/weakness_ledger.md]
    docs_must_contain: ["정정 박스와 본문을 구분"]
    code:
      file: scripts/audit_numbers.py
      function: classify
      must_use: ["RECORD_MARKERS", "RECORD_SECTIONS"]
    broke_once: "깨진 적은 없다. 사라지면 오탐이 폭증해 **아무도 보지 않는 검사**가 된다 — 조용한 무력화다"

  - id: thesis-count-crosscheck
    claim: "원고 집계는 목차를 만든 자료에서 세고 본문·목차를 대조한다 — 사람이 grep으로 세면 틀린다 (개요 §7)"
    docs: [thesis_outline_20260910.md]
    docs_must_contain: ["본문·목차 대조 통과"]
    code:
      file: scripts/build_thesis.py
      function: main
      must_use: ["n_body_tab"]
    broke_once: "2026-10-02 — 표 41·절 59로 보고했으나 40·57이었다. 문단 제목이 표 패턴에 걸리고 목차 제목이 본문 절로 세어졌다"

  - id: c10-ledger-selfcheck
    claim: "C10 — 원장 자신의 정합성(대응표 누락·번호 중복·열림 규칙)을 검사하고, 논문 8.3·8.4와 직접 대조한다"
    docs: [docs/weakness_ledger.md]
    docs_must_contain: ["이 원장 자신이 논문과 어긋남"]
    code:
      file: scripts/ledger_stats.py
      function: main
      must_use: ["paper_limits", "map_L"]
    broke_once: "2026-10-02 — 대응표 대조를 수동으로 두 번 했고(한계 넷 누락, 8.4절 누락), 구획을 안 나눠 센 집계가 두 번 틀렸다"

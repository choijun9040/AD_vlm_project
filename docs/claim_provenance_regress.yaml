- id: regress_int8_resolution_mix
  where: "결함 재현: Table 1의 INT8 열이 평가 해상도에서 왔던 상태"
  sources:
    - eval_results/resolution_sweep/res_1440000.json
    - eval_results/int8_quant_error.json      # 평가 해상도(200,704) — 옛 상태
  allow_differ:
    n_images: "250 vs 200"
- id: regress_lambda_source_mix
  where: "결함 재현: 본문이 250장, Fig.2가 799장이던 상태 (n_images 미허용)"

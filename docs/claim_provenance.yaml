- id: ksae_para4_lambda_fig2
  where: "ksae2026_abstract.md — 4번 문단 + Fig. 2 (λ 용량-반응 · 자기정렬 · fixA)"
  sources:
    - eval_results/lambda_sweep_activation_profile.json   # Fig. 2가 읽는 파일
    - eval_results/align_target_profile.json              # 자기정렬 51%의 출처
    - eval_results/mcnemar_fixa.json                      # fixA 정확도 비용
  allow_differ:
    n_images: >-
      λ 수치와 Fig. 2는 799장 실행에서, 자기정렬 51%는 aligntgt_base3b와
      짝지은 250장 실행에서 온다. 짝지은 비교는 같은 실행 안에서만 유효하므로
      합칠 수 없다. **본문의 λ 끝점은 반드시 799장 쪽을 쓴다(그림과 같아야 한다).**
      2026-09-15 이전 판은 본문이 250장, 그림이 799장이어서 끝점이 어긋났다.
    max_pixels: "λ·정렬 실행은 200,704, McNemar는 예측 파일 대조라 해상도 개념 없음"
    min_pixels: "위와 같음"
  values:
    - claim: "λ=0 blk31 p50 (Fig. 2와 같아야 함)"
      from: "eval_results/lambda_sweep_activation_profile.json::sweep_align0.0.passes.bfloat16.by_layer.31.p50"
      expect: 36608
      tol: 1
      docs:
        files: [ksae2026_abstract.md]
        render: ["{v:,.0f}"]
        stale: [36480]
    - claim: "λ=2.0 blk31 p50 (Fig. 2와 같아야 함)"
      from: "eval_results/lambda_sweep_activation_profile.json::sweep_align2.0.passes.bfloat16.by_layer.31.p50"
      expect: 14208
      tol: 1
      docs:
        files: [ksae2026_abstract.md]
        render: ["{v:,.0f}"]
        stale: [14464]
    - claim: "fixA McNemar p"
      from: "eval_results/mcnemar_fixa.json::p"
      expect: 0.25
      tol: 0.005
    - claim: "fixA 문항 수"
      from: "eval_results/mcnemar_fixa.json::n_items"
      expect: 11309

# ---------------------------------------------------------------------------
# O6 확장 (2026-09-17) — 요약문 본문의 정확도·붕괴율·짝지은 검정 수치
#
# 이전 매니페스트는 여유·SNR·TRT 위주였고 **정확도 계열이 통째로 빠져 있었다**.
# 요약문이 인용하는 49.95 / 1.36 / 50.73 / 52.38 / 52.87과 두 McNemar가
# 어디서 왔는지 검사기가 알지 못했다.
# ---------------------------------------------------------------------------
- id: 정확도 · 배포 조건
  where: "요약문 2·5문단, 학위논문 §7.3"
  sources:
    - eval_results/student_baseline_v2_epoch_1_native_bf16_nuscenesqa_val.json
    - eval_results/student_baseline_v2_epoch_1_native_fp16_nuscenesqa_val.json
    - eval_results/student_baseline_v2_epoch_1_native_fp16_fixa_nuscenesqa_val.json
    - eval_results/student_full_epoch_1_native_fp16_nuscenesqa_val.json
    - eval_results/student_full_epoch_1_native_bf16_nuscenesqa_val.json
  allow_differ:
    checkpoint: "체크포인트와 dtype이 다른 것이 이 그룹의 요점이다 — 나머지(stride-11 1,029문항·원본 해상도·max_new_tokens 16)는 같다"
    dtype: "위와 같다"
    precision: "위와 같다"
  values:
    - claim: "baseline_v2 원본·bf16 정확도"
      from: "eval_results/student_baseline_v2_epoch_1_native_bf16_nuscenesqa_val.json::accuracy"
      expr: "100*x"
      expect: 49.95
      tol: 0.01
      docs: {files: [ksae2026_abstract.md, thesis_outline_20260910.md], render: ["{v:.2f}%"]}
    - claim: "baseline_v2 원본·fp16 정확도 (붕괴)"
      from: "eval_results/student_baseline_v2_epoch_1_native_fp16_nuscenesqa_val.json::accuracy"
      expr: "100*x"
      expect: 1.36
      tol: 0.01
      docs: {files: [ksae2026_abstract.md, thesis_outline_20260910.md], render: ["{v:.2f}%"]}
    - claim: "baseline_v2 원본·fp16 교정 정확도"
      from: "eval_results/student_baseline_v2_epoch_1_native_fp16_fixa_nuscenesqa_val.json::accuracy"
      expr: "100*x"
      expect: 50.73
      tol: 0.01
      docs: {files: [ksae2026_abstract.md, thesis_outline_20260910.md], render: ["{v:.2f}%"]}
    - claim: "full 원본·fp16 정확도"
      from: "eval_results/student_full_epoch_1_native_fp16_nuscenesqa_val.json::accuracy"
      expr: "100*x"
      expect: 52.38
      tol: 0.01
      docs: {files: [ksae2026_abstract.md, thesis_outline_20260910.md], render: ["{v:.2f}%"]}
    - claim: "full 원본·bf16 정확도 (2026-09-17 측정)"
      from: "eval_results/student_full_epoch_1_native_bf16_nuscenesqa_val.json::accuracy"
      expr: "100*x"
      expect: 52.87
      tol: 0.01
      docs: {files: [ksae2026_abstract.md, thesis_outline_20260910.md], render: ["{v:.2f}%"]}

- id: 짝지은 검정 · 배포 조건
  where: "요약문 2·5문단, 학위논문 §7.3③⑥"
  sources:
    - eval_results/mcnemar_fixa_native.json
    - eval_results/mcnemar_full_native_dtype.json
  allow_differ:
    a: "비교 대상이 다른 것이 요점이다 — 둘 다 같은 1,029문항 짝이다"
    b: "위와 같다"
  values:
    - claim: "교정 비용 McNemar p (교정 fp16 대 무교정 bf16, 원본)"
      from: "eval_results/mcnemar_fixa_native.json::p"
      expect: 0.34
      tol: 0.005
      # stale에 0.25를 넣지 않는다 — 그 값은 **다른 측정**(11,309문항·평가 해상도)이고
      # 폐기가 아니라 조건이 다른 기록으로 공존한다. 폐기된 것은 −0.59%p 쪽이다.
      docs: {files: [ksae2026_abstract.md, thesis_outline_20260910.md], render: ["p={v:.2f}"]}
    - claim: "교정 비용 %p"
      from: "eval_results/mcnemar_fixa_native.json::diff_pp"
      expect: 0.78
      tol: 0.005
      docs: {files: [ksae2026_abstract.md, thesis_outline_20260910.md], render: ["+{v:.2f}%p"], stale: [-0.59]}
    - claim: "교정 불일치 쌍"
      from: "eval_results/mcnemar_fixa_native.json::n_discordant"
      expect: 54
    - claim: "full dtype McNemar p (fp16 대 bf16, 원본)"
      from: "eval_results/mcnemar_full_native_dtype.json::p"
      expect: 0.27
      tol: 0.005
      docs: {files: [ksae2026_abstract.md, thesis_outline_20260910.md], render: ["p={v:.2f}"]}
    - claim: "full dtype 불일치 쌍"
      from: "eval_results/mcnemar_full_native_dtype.json::n_discordant"
      expect: 13

